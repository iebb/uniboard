name: Validate Uniboard website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'Scripts/validate_website.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'iebb/uniboard' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate publication boundary and SEO metadata
        run: python3 Scripts/validate_website.py
