name: Uniboard
options:
  bundleIdPrefix: ad.neko
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7P8CLHDH5G
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Uniboard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.uniboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Uniboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Uniboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: UniboardKeyboard
        embed: true
  UniboardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
      - path: Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.uniboard.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  UniboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.uniboard.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Uniboard
  UniboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.uniboard.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Uniboard
schemes:
  Uniboard:
    build:
      targets:
        Uniboard: all
    test:
      gatherCoverageData: false
      environmentVariables:
        UNIBOARD_KEYBOARD_INTEGRATION: $(UNIBOARD_KEYBOARD_INTEGRATION)
      targets:
        - UniboardTests
        - UniboardUITests
